[project]
name = "ai-sandbox"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "ryouhama", email = "r0730hacap@icloud.com" }
]
dependencies = [
    "openai>=1.63.2",
    "langchain>=0.3.19",
    "langchain-openai>=0.3.6",
]
readme = "README.md"
requires-python = ">= 3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ai_sandbox"]
